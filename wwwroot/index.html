<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Telemetry</title>
<link rel="icon" type="image/x-icon" href="/rc-favicon-tm.ico">
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.0/signalr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --bg3: #141923;
    --border: #1e2736;
    --accent: #e8ff00;
    --accent2: #ff3c3c;
    --accent3: #00d4ff;
    --text: #c9d4e8;
    --text-dim: #4a5568;
    --text-bright: #ffffff;
    --card: #0f141d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(232,255,0,0.04) 0%, transparent 100%);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    cursor: pointer;
  }

  .logo span { color: var(--text-dim); }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    animation: pulse 1.5s infinite;
  }

  .live-dot.connected { background: var(--accent); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .layout {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 64px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    position: sticky;
    top: 0;
  }

  .sidebar-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 8px 20px 12px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .sidebar-item:hover {
    background: rgba(232,255,0,0.04);
    border-left-color: rgba(232,255,0,0.3);
    color: var(--text-bright);
  }

  .sidebar-item.active {
    background: rgba(232,255,0,0.08);
    border-left-color: var(--accent);
    color: var(--accent);
  }

  .driver-num {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 28px;
  }

  .driver-info { flex: 1; }
  .driver-name-sm { font-size: 13px; line-height: 1.2; }
  .driver-team-sm { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  .main { padding: 32px 40px; overflow-y: auto; }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 28px;
    letter-spacing: 1px;
  }

  .breadcrumb-item {
    cursor: pointer;
    transition: color 0.15s;
  }

  .breadcrumb-item:hover { color: var(--accent3); }
  .breadcrumb-sep { color: var(--border); }
  .breadcrumb-current { color: var(--text); cursor: default; }

  /* Back button */
  .back-btn {
    display: none;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 8px 16px;
    cursor: pointer;
    margin-bottom: 24px;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .back-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  .back-btn.visible { display: flex; }

  /* Sessions grid (home) */
  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
    margin-bottom: 32px;
  }

  .session-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    position: relative;
  }

  .session-card:hover {
    border-left-color: var(--accent3);
    background: rgba(0,212,255,0.04);
  }

  .session-card-circuit {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 6px;
  }

  .session-card-country { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }

  .session-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .session-card-date { font-size: 11px; color: var(--text-dim); }
  .session-card-drivers {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    color: var(--accent3);
    letter-spacing: 1px;
  }

  /* Session leaderboard */
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 32px;
  }

  .lb-table th {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: left;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }

  .lb-table th:last-child, .lb-table td:last-child { text-align: right; }

  .lb-table tr.lb-data-row {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  .lb-table tr.lb-data-row:hover { background: rgba(255,255,255,0.02); }
  .lb-table tr.lb-data-row:first-child td { color: var(--accent); }

  .lb-table td {
    padding: 14px 16px;
    font-size: 13px;
  }

  .lb-pos {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--text-dim);
    width: 40px;
  }

  .lb-table tr.lb-data-row:first-child .lb-pos { color: var(--accent); }

  .lb-driver-num {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--accent);
    width: 50px;
  }

  .lb-driver-name { font-size: 13px; color: var(--text-bright); }
  .lb-driver-team { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .lb-laptime {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    color: var(--accent);
    text-align: right;
  }

  .lb-table tr.lb-data-row:not(:first-child) .lb-laptime { color: var(--text); }
  .lb-lapnum { font-size: 11px; color: var(--text-dim); text-align: right; }

  /* Driver hero */
  .driver-hero {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .driver-headshot {
    width: 100px; height: 100px;
    object-fit: cover;
    border: 2px solid var(--border);
    background: var(--card);
    flex-shrink: 0;
  }

  .driver-headshot-placeholder {
    width: 100px; height: 100px;
    background: var(--card);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 24px;
    font-weight: 900;
    color: var(--accent);
    flex-shrink: 0;
  }

  .driver-hero-number {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .driver-hero-name {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: var(--text-bright);
    line-height: 1;
    margin-bottom: 6px;
  }

  .driver-hero-team { font-size: 12px; color: var(--text-dim); }

  /* Laps grid */
  .laps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 32px;
  }

  .lap-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .lap-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--border);
    transition: background 0.15s;
  }

  .lap-card:hover { border-color: rgba(0,212,255,0.4); }
  .lap-card:hover::before { background: var(--accent3); }
  .lap-card.selected { border-color: var(--accent3); background: rgba(0,212,255,0.06); }
  .lap-card.selected::before { background: var(--accent3); }
  .lap-card.fastest { border-color: rgba(232,255,0,0.4); }
  .lap-card.fastest::before { background: var(--accent); }
  .lap-card.fastest.selected { border-color: var(--accent); background: rgba(232,255,0,0.06); }

  .lap-num { font-family: 'Orbitron', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px; }
  .lap-time-val { font-family: 'Orbitron', monospace; font-size: 14px; color: var(--text-bright); }
  .lap-card.fastest .lap-time-val { color: var(--accent); }
  .lap-card.selected:not(.fastest) .lap-time-val { color: var(--accent3); }
  .lap-sectors { display: flex; gap: 3px; margin-top: 8px; }
  .sector { flex: 1; height: 2px; background: var(--border); border-radius: 1px; }
  .lap-card.fastest .sector { background: rgba(232,255,0,0.4); }
  .lap-pit { font-size: 9px; color: var(--accent2); letter-spacing: 1px; margin-top: 4px; text-transform: uppercase; }

  /* Charts */
  .chart-wrapper {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }

  .chart-title {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Sync */
  .sync-panel {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 32px;
  }

  .sync-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-label { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }

  .sync-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 8px 12px;
    width: 140px;
    outline: none;
    transition: border-color 0.15s;
  }

  .sync-input:focus { border-color: var(--accent3); }

  .sync-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 9px 20px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 700;
    height: 37px;
    transition: opacity 0.15s;
  }

  .sync-btn:hover { opacity: 0.85; }
  .sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .sync-status { font-size: 12px; color: var(--text-dim); margin-top: 10px; min-height: 20px; }
  .sync-status.success { color: var(--accent); }
  .sync-status.error { color: var(--accent2); }
  .sync-status.loading { color: var(--accent3); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 12px; letter-spacing: 1px; }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent3);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 32px; right: 32px;
    background: var(--bg3);
    border: 1px solid var(--accent3);
    color: var(--accent3);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 12px 20px;
    z-index: 1000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">Racing<span>/</span>Telemetry</div>
  <div class="live-badge">
    <div class="live-dot" id="liveDot"></div>
    <span id="liveStatus">Connecting...</span>
  </div>
</header>

<div class="layout">
  <!-- Sidebar: drivers -->
  <aside class="sidebar">
    <div class="sidebar-label">Drivers</div>
    <div id="driversList"></div>
  </aside>

  <main class="main">

    <!-- Sync panel (always visible) -->
    <div class="section-title">Sync</div>
    <div class="sync-panel">
      <div class="sync-row">
        <div class="input-group">
          <label class="input-label">Session Key</label>
          <input class="sync-input" id="syncSessionKey" type="number" placeholder="e.g. 9161">
        </div>
        <div class="input-group">
          <label class="input-label">Driver Number</label>
          <input class="sync-input" id="syncDriverNum" type="number" placeholder="e.g. 55">
        </div>
        <button class="sync-btn" id="syncBtn" onclick="triggerSync()">Sync Session</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
    </div>

    <!-- HOME: Sessions list -->
    <div id="homeView">
      <div class="section-title">Sessions</div>
      <div class="sessions-grid" id="sessionsGrid"></div>
    </div>

    <!-- SESSION: Leaderboard -->
    <div id="sessionView" style="display:none">
      <div class="breadcrumb" id="sessionBreadcrumb"></div>
      <div class="section-title" id="sessionViewTitle"></div>
      <table class="lb-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>#</th>
            <th>Driver</th>
            <th>Lap</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>

    <!-- DRIVER LAPS: Laps for a driver in a session -->
    <div id="lapsView" style="display:none">
      <div class="breadcrumb" id="lapsBreadcrumb"></div>
      <div class="driver-hero" id="driverHero"></div>
      <div class="section-title">Laps</div>
      <div class="laps-grid" id="lapsGrid"></div>
    </div>

    <!-- TELEMETRY: Charts for a lap -->
    <div id="telemetryView" style="display:none">
      <div class="breadcrumb" id="telemetryBreadcrumb"></div>
      <div class="section-title" id="telemetryTitle"></div>
      <div class="chart-wrapper">
        <div class="chart-title">Speed (km/h)</div>
        <canvas id="speedChart" height="80"></canvas>
      </div>
      <div class="charts-grid">
        <div class="chart-wrapper">
          <div class="chart-title">Throttle vs Brake (%)</div>
          <canvas id="throttleBrakeChart" height="120"></canvas>
        </div>
        <div class="chart-wrapper">
          <div class="chart-title">Gear / RPM</div>
          <canvas id="gearRpmChart" height="120"></canvas>
        </div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let charts = {};
let state = {
  sessions: [],
  drivers: [],
  currentSession: null,
  currentDriver: null,
  currentLaps: [],
  fastestLapId: null,
};

// ── Fetch ──────────────────────────────────────────────────
async function get(path) {
  const res = await fetch(`${API}${path}`);
  if (!res.ok) return null;
  return res.json();
}

async function post(path) {
  return fetch(`${API}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
}

// ── Views ──────────────────────────────────────────────────
function showOnly(id) {
  ['homeView', 'sessionView', 'lapsView', 'telemetryView'].forEach(v => {
    document.getElementById(v).style.display = v === id ? 'block' : 'none';
  });
}

function goHome() {
  showOnly('homeView');
  state.currentSession = null;
  state.currentDriver = null;
  loadDriversSidebar();
}

// ── Breadcrumb ─────────────────────────────────────────────
function breadcrumb(elId, items) {
  // items: [{label, onClick}] last item has no onClick (current)
  const el = document.getElementById(elId);
  el.innerHTML = items.map((item, i) => {
    const isLast = i === items.length - 1;
    if (isLast) return `<span class="breadcrumb-current">${item.label}</span>`;
    return `<span class="breadcrumb-item" onclick="${item.fn}">${item.label}</span><span class="breadcrumb-sep">›</span>`;
  }).join('');
}

// ── Home: Sessions ─────────────────────────────────────────
async function loadHome() {
  const sessions = await get('/sessions');
  state.sessions = sessions || [];
  const el = document.getElementById('sessionsGrid');

  if (!state.sessions.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🏁</div>No sessions yet. Sync a session to get started.</div>';
    return;
  }

  // Get driver count per session
  const enriched = await Promise.all(state.sessions.map(async s => {
    const ds = await get(`/sessions/${s.id}/leaderboard`);
    return { ...s, driverCount: ds ? ds.length : 0 };
  }));

  el.innerHTML = enriched.map(s => `
    <div class="session-card" onclick="openSession(${s.id}, '${s.circuit}', '${s.country}', '${s.date}')">
      <div class="session-card-circuit">${s.circuit} - ${s.sessionName}</div>
      <div class="session-card-country">${s.country}</div>
      <div class="session-card-meta">
        <div class="session-card-date">${formatDate(s.date)}</div>
        <div class="session-card-drivers">${s.driverCount} drivers</div>
      </div>
    </div>
  `).join('');
}

// ── Session: Leaderboard ───────────────────────────────────
async function openSession(id, circuit, country, date) {
  state.currentSession = { id, circuit, country, date };
  showOnly('sessionView');

  breadcrumb('sessionBreadcrumb', [
    { label: 'Sessions', fn: 'goHome()' },
    { label: `${circuit} — ${country}` }
  ]);

  document.getElementById('sessionViewTitle').textContent = `${circuit} · ${formatDate(date)}`;

  const leaderboard = await get(`/sessions/${id}/leaderboard`);
  const tbody = document.getElementById('leaderboardBody');

  if (!leaderboard || leaderboard.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">No lap data for this session</div></td></tr>`;
    return;
  }

  tbody.innerHTML = leaderboard.map((entry, i) => `
    <tr class="lb-data-row" onclick="openDriverLaps(${entry.driverId || 0}, '${entry.driverName}', '${entry.team}', ${entry.driverNumber}, '${entry.headshot || ''}', ${id})">
      <td class="lb-pos">${i + 1}</td>
      <td class="lb-driver-num">#${entry.driverNumber}</td>
      <td>
        <div class="lb-driver-name">${entry.driverName}</div>
        <div class="lb-driver-team">${entry.team}</div>
      </td>
      <td class="lb-lapnum">LAP ${entry.lapNumber}</td>
      <td class="lb-laptime">${formatTime(entry.lapTime)}</td>
    </tr>
  `).join('');
}

// ── Driver Laps ────────────────────────────────────────────
async function openDriverLaps(driverId, name, team, number, headshot, sessionId) {
  state.currentDriver = { id: driverId, name, team, number, headshot };
  showOnly('lapsView');

  const { circuit, country, date } = state.currentSession;

  breadcrumb('lapsBreadcrumb', [
    { label: 'Sessions', fn: 'goHome()' },
    { label: `${circuit}`, fn: `openSession(${sessionId}, '${circuit}', '${country}', '${date}')` },
    { label: name }
  ]);

  // Driver hero
  const hsHtml = (headshot && headshot !== 'null' && headshot !== '')
    ? `<img class="driver-headshot" src="${headshot}" onerror="this.outerHTML='<div class=\\'driver-headshot-placeholder\\'>#${number}</div>'">`
    : `<div class="driver-headshot-placeholder">#${number}</div>`;

  document.getElementById('driverHero').innerHTML = `
    ${hsHtml}
    <div>
      <div class="driver-hero-number">Driver #${number}</div>
      <div class="driver-hero-name">${name}</div>
      <div class="driver-hero-team">${team}</div>
    </div>
  `;

  // Laps
  const laps = await get(`/sessions/${sessionId}/laps`);
  const driverLaps = laps ? laps.filter(l => l.driverId === driverId) : [];
  state.currentLaps = driverLaps;

  console.log('filtering', driverId, typeof driverId, laps[0]?.driverId, typeof laps[0]?.driverId);

  if (!driverLaps.length) {
    document.getElementById('lapsGrid').innerHTML = '<div class="empty-state">No laps found</div>';
    return;
  }

  const fastest = driverLaps.reduce((a, b) => a.lapTime < b.lapTime ? a : b);
  state.fastestLapId = fastest.id;

  document.getElementById('lapsGrid').innerHTML = driverLaps.map(lap => `
    <div class="lap-card ${lap.id === fastest.id ? 'fastest' : ''}" id="lapCard${lap.id}"
         onclick="openTelemetry(${lap.id}, ${lap.lapNumber}, ${lap.id === fastest.id})">
      <div class="lap-num">LAP ${lap.lapNumber}</div>
      <div class="lap-time-val">${formatTime(lap.lapTime)}</div>
      ${lap.isPitOutLap ? '<div class="lap-pit">pit out</div>' : ''}
      <div class="lap-sectors">
        <div class="sector"></div><div class="sector"></div><div class="sector"></div>
      </div>
    </div>
  `).join('');
}

// ── Telemetry ──────────────────────────────────────────────
async function openTelemetry(lapId, lapNumber, isFastest) {
  document.querySelectorAll('.lap-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById(`lapCard${lapId}`);
  if (card) card.classList.add('selected');

  showOnly('telemetryView');

  const { circuit, country, date } = state.currentSession;
  const { name, number, id: driverId } = state.currentDriver;
  const sessionId = state.currentSession.id;

  breadcrumb('telemetryBreadcrumb', [
    { label: 'Sessions', fn: 'goHome()' },
    { label: circuit, fn: `openSession(${sessionId}, '${circuit}', '${country}', '${date}')` },
    { label: name, fn: `openDriverLaps(${driverId}, '${name}', '${state.currentDriver.team}', ${number}, '${state.currentDriver.headshot}', ${sessionId})` },
    { label: `Lap ${lapNumber}${isFastest ? ' ★' : ''}` }
  ]);

  document.getElementById('telemetryTitle').textContent = `Lap ${lapNumber}${isFastest ? ' — Fastest Lap' : ''}`;

  const points = await get(`/laps/${lapId}/telemetry`);

  if (!points || points.length === 0) {
    document.getElementById('telemetryView').innerHTML += '<div class="empty-state">No telemetry data for this lap</div>';
    return;
  }

  points.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const labels = points.map((_, i) => i);
  const color = isFastest ? '#e8ff00' : '#00d4ff';

  renderSpeedChart(labels, points, color);
  renderThrottleBrakeChart(labels, points);
  renderGearRpmChart(labels, points);
}

// ── Charts ─────────────────────────────────────────────────
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function renderSpeedChart(labels, points, color) {
  destroyChart('speed');
  const ctx = document.getElementById('speedChart').getContext('2d');
  charts['speed'] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data: points.map(p => p.speed), borderColor: color, backgroundColor: color + '18', borderWidth: 2, pointRadius: 0, fill: true, tension: 0.3 }] },
    options: chartOptions(0, 400)
  });
}

function renderThrottleBrakeChart(labels, points) {
  destroyChart('throttle');
  const ctx = document.getElementById('throttleBrakeChart').getContext('2d');
  charts['throttle'] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Throttle', data: points.map(p => p.throttlePercentage), borderColor: '#e8ff00', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.2 },
      { label: 'Brake', data: points.map(p => p.brakePercentage), borderColor: '#ff3c3c', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.2 }
    ]},
    options: { ...chartOptions(0, 110), plugins: { legend: { display: true, labels: { color: '#4a5568', font: { family: 'DM Mono', size: 10 }, boxWidth: 12 } } } }
  });
}

function renderGearRpmChart(labels, points) {
  destroyChart('gearrpm');
  const ctx = document.getElementById('gearRpmChart').getContext('2d');
  charts['gearrpm'] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Gear', data: points.map(p => p.gear), borderColor: '#00d4ff', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1, yAxisID: 'y' },
      { label: 'RPM (÷1000)', data: points.map(p => p.rpm / 1000), borderColor: '#a855f7', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3, yAxisID: 'y2' }
    ]},
    options: {
      responsive: true, animation: { duration: 400 },
      plugins: { legend: { display: true, labels: { color: '#4a5568', font: { family: 'DM Mono', size: 10 }, boxWidth: 12 } } },
      scales: {
        x: { display: false },
        y: { position: 'left', min: 0, max: 9, grid: { color: '#1e2736' }, ticks: { color: '#4a5568', font: { family: 'DM Mono', size: 9 }, stepSize: 1 } },
        y2: { position: 'right', min: 0, max: 15, grid: { display: false }, ticks: { color: '#4a5568', font: { family: 'DM Mono', size: 9 } } }
      }
    }
  });
}

function chartOptions(min, max) {
  return {
    responsive: true, animation: { duration: 400 },
    plugins: { legend: { display: false } },
    scales: {
      x: { display: false },
      y: { min, max, grid: { color: '#1e2736' }, ticks: { color: '#4a5568', font: { family: 'DM Mono', size: 9 } } }
    }
  };
}

// ── Drivers sidebar ────────────────────────────────────────
async function loadDriversSidebar() {
  const drivers = await get('/drivers');
  state.drivers = drivers || [];
  const el = document.getElementById('driversList');

  if (!state.drivers.length) {
    el.innerHTML = '<div style="padding:10px 20px;font-size:11px;color:var(--text-dim)">No drivers synced</div>';
    return;
  }

  el.innerHTML = state.drivers.map(d => `
    <div class="sidebar-item" onclick="filterByDriver(${d.id}, '${d.name}', '${d.team}', ${d.driverNumber}, '${d.headshot || ''}')">
      <div class="driver-num">#${d.driverNumber}</div>
      <div class="driver-info">
        <div class="driver-name-sm">${d.name}</div>
        <div class="driver-team-sm">${d.team}</div>
      </div>
    </div>
  `).join('');
}

async function filterByDriver(id, name, team, number, headshot) {
  // Show all sessions for this driver
  const sessions = await get(`/drivers/${id}/sessions`);
  showOnly('homeView');

  const el = document.getElementById('sessionsGrid');

  if (!sessions || sessions.length === 0) {
    document.getElementById('homeView').querySelector('.section-title') && null;
    el.innerHTML = '<div class="empty-state">No sessions for this driver</div>';
    return;
  }

  el.innerHTML = sessions.map(s => `
    <div class="session-card" onclick="openSession(${s.id}, '${s.circuit}', '${s.country}', '${s.date}')">
      <div class="session-card-circuit">${s.circuit}</div>
      <div class="session-card-country">${s.country}</div>
      <div class="session-card-meta">
        <div class="session-card-date">${formatDate(s.date)}</div>
      </div>
    </div>
  `).join('');
}

// ── Sync ───────────────────────────────────────────────────
async function triggerSync() {
  const sessionKey = document.getElementById('syncSessionKey').value;
  const driverNum = document.getElementById('syncDriverNum').value;
  if (!sessionKey || !driverNum) return;

  const btn = document.getElementById('syncBtn');
  const status = document.getElementById('syncStatus');
  btn.disabled = true;
  status.className = 'sync-status loading';
  status.innerHTML = '<span class="spinner"></span>Syncing...';

  const res = await post(`/sync/session/${sessionKey}/${driverNum}`);
  if (res.ok) {
    status.className = 'sync-status success';
    status.textContent = `✓ Session ${sessionKey} synced`;
    await loadDriversSidebar();
    await loadHome();
  } else {
    const err = await res.json().catch(() => ({}));
    status.className = 'sync-status error';
    status.textContent = `✗ ${err.message || 'Sync failed'}`;
  }
  btn.disabled = false;
}

// ── SignalR ────────────────────────────────────────────────
function connectSignalR() {
  const connection = new signalR.HubConnectionBuilder()
    .withUrl(`/hubs/sessions`)
    .withAutomaticReconnect()
    .build();

  connection.on('SessionSynced', async (data) => {
    showToast(`New session: ${data.circuit}`);
    await loadHome();
    await loadDriversSidebar();
  });

  connection.onreconnecting(() => {
    document.getElementById('liveStatus').textContent = 'Reconnecting...';
    document.getElementById('liveDot').classList.remove('connected');
  });

  connection.onreconnected(() => {
    document.getElementById('liveStatus').textContent = 'Live';
    document.getElementById('liveDot').classList.add('connected');
  });

  connection.start()
    .then(() => {
      document.getElementById('liveStatus').textContent = 'Live';
      document.getElementById('liveDot').classList.add('connected');
    })
    .catch(() => {
      document.getElementById('liveStatus').textContent = 'Offline';
    });
}

// ── Helpers ────────────────────────────────────────────────
function formatTime(s) {
  if (!s) return '--:--.---';
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(3).padStart(6, '0');
  return `${m}:${sec}`;
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Init ───────────────────────────────────────────────────
async function init() {
  await loadDriversSidebar();
  await loadHome();
  connectSignalR();
}

init();
</script>
